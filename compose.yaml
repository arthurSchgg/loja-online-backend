services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lojinha_da_katia
      POSTGRES_USER: lojinha
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD em .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lojinha -d lojinha_da_katia"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
