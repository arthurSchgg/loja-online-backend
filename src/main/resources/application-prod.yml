# Production-ready defaults for a reverse-proxied HTTPS deployment.
# All credentials must be injected from the runtime secret manager.
server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: lax
spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  security:
    password-reset-url: ${ADMIN_PASSWORD_RESET_URL:https://lojinha-da-katia-api-rjvx.onrender.com/reset-password.html}
    email-change-url: ${ADMIN_EMAIL_CHANGE_URL:https://lojinha-da-katia-api-rjvx.onrender.com/confirm-email.html}
