spring:
  application:
    name: loja-online
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lojinha_da_katia}
    username: ${DB_USERNAME:lojinha}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 32
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  mail:
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
server:
  port: ${SERVER_PORT:${PORT:8080}}
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/problem+json,text/plain,text/html,text/css,application/javascript
  error:
    include-message: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
management:
  health:
    # Delivery is asynchronous and must not take the public catalog offline.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  security:
    admin-username: ${ADMIN_USERNAME:}
    admin-password: ${ADMIN_PASSWORD:}
    admin-email: ${ADMIN_EMAIL:}
    email-outbox-key: ${EMAIL_OUTBOX_KEY:}
    password-reset-url: ${ADMIN_PASSWORD_RESET_URL:}
    mail-from: ${MAIL_FROM:}
    email-transport: ${EMAIL_TRANSPORT:smtp}
    resend-api-key: ${RESEND_API_KEY:}
    email-change-url: ${ADMIN_EMAIL_CHANGE_URL:}
    breached-password-check-enabled: ${BREACHED_PASSWORD_CHECK_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500}
