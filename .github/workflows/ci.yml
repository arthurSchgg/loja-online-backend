name: Backend CI
on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'integration/**', 'release/**']
  pull_request:
    branches: [main, develop, 'integration/**', 'release/**']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate Java package layout and internal source imports
        run: python3 scripts/check_java_references.py
      - name: Test staging login bootstrap readiness safeguards
        run: python3 -m unittest discover -s scripts -p 'test_staging_smoke_login.py'
      - name: Validate Docker Compose definitions without starting containers
        run: |
          docker compose --env-file .env.example -f compose.yaml config --quiet
          docker compose --env-file .env.staging.example -f compose.staging.yaml config --quiet
          bash -n scripts/*.sh
      - name: Install and start PostgreSQL for integration tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql
          sudo service postgresql start
          sudo -u postgres psql -c "ALTER ROLE postgres WITH PASSWORD 'postgres_ci_password';"
          sudo -u postgres createdb lojinha_ci
      - name: Start isolated SMTP capture for integration tests
        run: |
          docker run -d --rm --name lojinha-ci-mailpit \
            -p 127.0.0.1:1025:1025 -p 127.0.0.1:8025:8025 \
            axllent/mailpit:v1.33.1
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8025/api/v1/info; then
              exit 0
            fi
            sleep 1
          done
          docker logs lojinha-ci-mailpit
          exit 1
      - name: Run tests and package
        env:
          RUN_POSTGRES_INTEGRATION: 'true'
          RUN_SMTP_INTEGRATION: 'true'
          POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/lojinha_ci
          POSTGRES_TEST_USER: postgres
          POSTGRES_TEST_PASSWORD: postgres_ci_password
        run: mvn -B verify
      - name: Upload test and JaCoCo reports for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-jacoco-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/site/jacoco/
            target/jacoco.exec
            target/surefire-reports/
      - name: Verify PostgreSQL backup and isolated restore
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres_ci_password
          PGDATABASE: lojinha_ci
          BACKUP_DIR: /tmp/lojinha-ci-backups
          RESTORE_TARGET_DATABASE: lojinha_ci_restore_test
        run: |
          bash scripts/backup-postgres.sh
          archive="$(find "$BACKUP_DIR" -maxdepth 1 -name '*.dump' -print -quit)"
          test -n "$archive"
          bash scripts/verify-postgres-restore.sh "$archive"


  staging-https-smoke:
    # Separate disposable stack; no real addresses, cloud services or credentials.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Generate temporary staging-only configuration
        shell: bash
        run: |
          umask 077
          {
            echo 'DB_NAME=lojinha_smoke_ci'
            echo 'DB_USERNAME=lojinha_smoke_ci'
            echo "DB_PASSWORD=$(openssl rand -hex 24)"
            echo 'ADMIN_USERNAME=staging-ci-admin'
            echo "ADMIN_PASSWORD=$(openssl rand -hex 24)"
            echo 'ADMIN_EMAIL=staging-ci-admin@example.invalid'
            echo "EMAIL_OUTBOX_KEY=$(openssl rand -base64 32)"
            echo 'MAIL_FROM=no-reply@staging.invalid'
            echo 'STAGING_HTTPS_PORT=18443'
            echo 'STAGING_MAILPIT_UI_PORT=18025'
            echo 'ADMIN_PASSWORD_RESET_URL=https://localhost:18443/reset-password'
            echo 'ADMIN_EMAIL_CHANGE_URL=https://localhost:18443/confirm-email'
            # External breach checks remain enabled by default everywhere else.
            # This isolated test does not rely on third-party network availability.
            echo 'BREACHED_PASSWORD_CHECK_ENABLED=false'
          } > .env.staging.ci
          docker compose --env-file .env.staging.ci -f compose.staging.yaml config --quiet
      - name: Build and start HTTPS staging stack with isolated PostgreSQL and Mailpit
        run: docker compose --env-file .env.staging.ci -f compose.staging.yaml up -d --build
      - name: Verify local Caddy CA certificate and readiness
        shell: bash
        run: |
          set -euo pipefail
          ca_file="$RUNNER_TEMP/lojinha-staging-root-ca.crt"
          ready=false
          for attempt in $(seq 1 90); do
            docker compose --env-file .env.staging.ci -f compose.staging.yaml \
              exec -T proxy cat /data/caddy/pki/authorities/local/root.crt \
              > "$ca_file" 2>/dev/null || true
            if [ -s "$ca_file" ] && \
              curl --silent --fail --max-time 3 --cacert "$ca_file" \
                https://localhost:18443/actuator/health > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo 'Local staging did not become healthy with verified TLS'
            exit 1
          fi
          echo "STAGING_TEST_CA=$ca_file" >> "$GITHUB_ENV"
      - name: Smoke test through the actual HTTPS reverse proxy
        env:
          STAGING_TEST_BASE_URL: https://localhost:18443
          STAGING_TEST_ENV_FILE: .env.staging.ci
        run: python3 scripts/smoke-staging-https.py
      - name: Exercise recovery and email confirmation through HTTPS and Mailpit
        env:
          STAGING_TEST_BASE_URL: https://localhost:18443
          STAGING_TEST_ENV_FILE: .env.staging.ci
        run: python3 scripts/smoke-staging-security-email.py
      - name: Checkout pinned frontend public contract (read-only)
        uses: actions/checkout@v4
        with:
          repository: arthurSchgg/loja-online-frontend
          ref: b9b8bc1a1a0a6ac80a74f091a315b75a26392a4c
          path: frontend-public-contract
          persist-credentials: false
      - name: Verify frontend public API contract through trusted staging HTTPS
        env:
          NODE_EXTRA_CA_CERTS: ${{ env.STAGING_TEST_CA }}
        run: |
          node --version
          node frontend-public-contract/scripts/public-api-smoke.mjs https://localhost:18443
      - name: Show containers on failure (no secret contents)
        if: failure()
        run: docker compose --env-file .env.staging.ci -f compose.staging.yaml ps
      - name: Tear down disposable staging and test volumes
        if: always()
        run: |
          docker compose --env-file .env.staging.ci -f compose.staging.yaml down -v --remove-orphans || true
          rm -f .env.staging.ci
