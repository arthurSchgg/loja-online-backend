name: AWS ECR - Publish approved container image

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Immutable approved release Git tag (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify immutable SemVer release tag input
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          [[ "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Release reference must be vMAJOR.MINOR.PATCH'; exit 1;
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Ensure release reference is a real tag
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          git show-ref --tags --verify --quiet "refs/tags/$RELEASE_REF"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_REF")"
          # Do not allow a release tag outside the protected main history.
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo 'Release tag is not reachable from main'; exit 1;
          }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: lojinha-ecr-publish
      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      - name: Build and publish exact release image (no ECS deploy)
        shell: bash
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          test -n "$REPOSITORY"
          test -n "$REGISTRY"
          docker build --pull -t "$REGISTRY/$REPOSITORY:$RELEASE_REF" .
          docker push "$REGISTRY/$REPOSITORY:$RELEASE_REF"
          docker inspect "$REGISTRY/$REPOSITORY:$RELEASE_REF" --format '{{index .RepoDigests 0}}' || true
          echo 'Image published; ECS deployment requires separate explicit approval.'
