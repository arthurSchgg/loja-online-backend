# Isolated local staging: the only published port is loopback HTTPS.
# No hosted service is provisioned.
name: lojinha-staging
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-lojinha_staging}
      POSTGRES_USER: ${DB_USERNAME:-lojinha_staging}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.staging}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Development-only SMTP sink: captures mail without contacting recipients.
  # UI is bound to the local machine; SMTP is reachable only by containers.
  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STAGING_MAILPIT_UI_PORT:-8025}:8025"
    expose:
      - "1025"
    environment:
      MP_MAX_MESSAGES: "200"
      MP_MAX_AGE: "1d"
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: staging
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-lojinha_staging}
      DB_USERNAME: ${DB_USERNAME:-lojinha_staging}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.staging}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env.staging}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env.staging}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin-staging@example.invalid}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      MAIL_FROM: ${MAIL_FROM:-no-reply@staging.invalid}
      EMAIL_OUTBOX_KEY: ${EMAIL_OUTBOX_KEY:-}
      ADMIN_PASSWORD_RESET_URL: ${ADMIN_PASSWORD_RESET_URL:-https://localhost:8443/reset-password}
      ADMIN_EMAIL_CHANGE_URL: ${ADMIN_EMAIL_CHANGE_URL:-https://localhost:8443/confirm-email}
      CORS_ALLOWED_ORIGINS: ""
      SESSION_COOKIE_SECURE: "true"
      SERVER_PORT: "8080"
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${STAGING_HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - staging_caddy_data:/data
      - staging_caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  staging_postgres_data:
  staging_caddy_data:
  staging_caddy_config:
